<!DOCTYPE html>
<html>
<head>
<title>{% block title %}Member Services{% endblock %} - Harbor Point CU</title>
<style>
  body { font-family: Verdana, Arial, sans-serif; font-size: 12px; background: #d4d0c8; margin: 0; }
  .hdr { background: #1f3a68; color: #ffffff; }
  .hdr td { padding: 6px 10px; }
  .hdr a { color: #ffffff; }
  .panel { background: #ffffff; border: 1px solid #808080; }
  .panel td { padding: 4px 8px; }
  .title { background: #c0c0c0; font-weight: bold; }
  .err { color: #b00000; font-weight: bold; }
  input, select { font-family: inherit; font-size: 12px; }
</style>
</head>
<body>
<table width="100%" cellspacing="0" cellpadding="0">
  <tr class="hdr">
    <td><b>HARBOR POINT CREDIT UNION</b> &nbsp;|&nbsp; Member Services Console v4.2</td>
    <td align="right">
      {% if session.operator %}
        Operator: {{ session.operator }} &nbsp; <a href="{{ url_for('logout') }}">Sign off</a>
      {% endif %}
    </td>
  </tr>
</table>
<br>
<table align="center" width="760" cellspacing="0" cellpadding="0">
  <tr><td>
    {% block content %}{% endblock %}
  </td></tr>
</table>
</body>
</html>
